[package]
name = "p3"
version = "0.1.0"
edition = "2024"

[dependencies]
p1 = {path = "../p1"}
p2 = {path = "../p2"}
itertools = "0.14"
anyhow = { version = "1.0.98", features = ["backtrace"] }
sha3 = "0.10.8"
bcs = "0.1.6"
keccak = "0.1.5"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1.9.0", features = ["attr-macro"] }
sfs-bigint = {git = "https://github.com/cmlsharp/sfs-bigint"}
num-traits = "0.2"
third_party_curve = {path = "./tests/third_party_curve"}

[profile.release]
debug = true
